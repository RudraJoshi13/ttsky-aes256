# Tiny Tapeout project information
project:
  title:        "AES-128/256 Encrypt and Decrypt (secworks core)"
  author:       "Rudra Joshi"
  discord:      ""
  description:  "Unmodified secworks AES core (FIPS-197, 128/256-bit keys, encrypt and decrypt) behind a byte-wide register interface"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "4x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rj_aes"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "aes.v"
    - "aes_core.v"
    - "aes_encipher_block.v"
    - "aes_decipher_block.v"
    - "aes_key_mem.v"
    - "aes_sbox.v"
    - "aes_inv_sbox.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "word[0]"
  ui[1]: "word[1]"
  ui[2]: "word[2]"
  ui[3]: "word[3]"
  ui[4]: "word[4]"
  ui[5]: "byte[0]"
  ui[6]: "byte[1]"
  ui[7]: "wr_strobe"

  # Outputs
  uo[0]: "rdata[0]"
  uo[1]: "rdata[1]"
  uo[2]: "rdata[2]"
  uo[3]: "rdata[3]"
  uo[4]: "rdata[4]"
  uo[5]: "rdata[5]"
  uo[6]: "rdata[6]"
  uo[7]: "rdata[7]"

  # Bidirectional pins (all used as inputs)
  uio[0]: "wdata[0]"
  uio[1]: "wdata[1]"
  uio[2]: "wdata[2]"
  uio[3]: "wdata[3]"
  uio[4]: "wdata[4]"
  uio[5]: "wdata[5]"
  uio[6]: "wdata[6]"
  uio[7]: "wdata[7]"

# Do not change!
yaml_version: 6
